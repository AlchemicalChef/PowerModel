# Fly.io app configuration — deploy with `fly deploy`
app = "powermodel-grid"
primary_region = "ord"

[build]

[deploy]
  # Run pending migrations before each new version takes traffic
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "powermodel-grid.fly.dev"
  PORT = "8080"
  # Fly's internal Postgres hostnames resolve via IPv6 AAAA only
  ECTO_IPV6 = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # "suspend" resumes in ~ms (no 502 cold-start race like "stop", which boots
  # the whole BEAM while fly-proxy is already connecting) and preserves
  # in-memory simulation state across idle periods.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Don't route to a machine until the app actually answers. The header is
  # required because force_ssl would 301 a plain-HTTP probe.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  # Power-flow solves on the 20k-bus network need real headroom
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
